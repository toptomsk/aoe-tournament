<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Open Unity Deep Link</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f6f9;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <h1>Open Unity App</h1>

    <button onclick="openTopicApp()">
        Mở topic
    </button>

    <button onclick="openPhonicApp()">
        Mở phonic
    </button>

    <button onclick="openBookApp()">
        Mở book
    </button>

    <script>
        function openTopicApp() {
            window.location.href =
                "enspireonline://open?type=mission&id=19";
        }

        function openPhonicApp() {
            window.location.href =
                "enspireonline://open?type=phonic&id=20";
        }

        function openBookApp() {
            window.location.href =
                "enspireonline://open?type=book&id=1&unit=3";
        }
    </script>

</body>
</html>
